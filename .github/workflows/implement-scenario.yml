name: Implement scenario (AI)

# Adds a Gherkin scenario to a feature file, has Claude Code implement the missing
# steps and page objects by exploring the app through Appium MCP, verifies the suite
# passes, and opens a pull request. Nothing is pushed if any step fails.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario on one line, parts separated by " | ". Example: @smoke Scenario: Add the bike light | When I open the product "Sauce Labs Bike Light" | And I add the product to the cart | And I open the "Cart" tab | Then the cart should contain 1 item'
        required: true
        type: string
      feature_file:
        description: 'Feature file to add the scenario to'
        required: true
        type: choice
        options:
          # feature-files:start (generated by `npm run sync:feature-choices`; don't edit by hand)
          - features/cart.feature
          - features/checkout.feature
          # feature-files:end
          - New feature file…
      new_feature_file:
        description: 'Only with "New feature file…": path of the file to create, e.g. features/catalog-sort.feature'
        required: false
        type: string
      runner:
        description: 'Self-hosted runner label (the runner needs Xcode and the iOS simulator)'
        required: false
        default: 'macOS'
        type: string

permissions:
  contents: write
  pull-requests: write

# Shares the simulator with the test workflow, so never run them at the same time
concurrency:
  group: ios-simulator
  cancel-in-progress: false

jobs:
  implement:
    runs-on: [self-hosted, '${{ inputs.runner }}']
    timeout-minutes: 90

    env:
      SCENARIO: ${{ inputs.scenario }}

    steps:
      - name: Resolve feature file
        env:
          CHOICE: ${{ inputs.feature_file }}
          NEW_FILE: ${{ inputs.new_feature_file }}
        run: |
          if [ "$CHOICE" = "New feature file…" ]; then
            if [ -z "$NEW_FILE" ]; then
              echo "::error::You chose \"New feature file…\"; also fill in new_feature_file (e.g. features/catalog-sort.feature)."
              exit 1
            fi
            FEATURE_FILE="$NEW_FILE"
          else
            if [ -n "$NEW_FILE" ]; then
              echo "::error::new_feature_file is only used with \"New feature file…\"; you chose $CHOICE. Clear one of them."
              exit 1
            fi
            FEATURE_FILE="$CHOICE"
          fi
          echo "FEATURE_FILE=$FEATURE_FILE" >> "$GITHUB_ENV"
          echo "Feature file: $FEATURE_FILE"

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.81

      - name: Add scenario to feature file
        id: scenario
        run: |
          node .github/scripts/add-scenario.mjs
          # Keep a copy so we can check the AI didn't change the human-written scenario
          cp "$FEATURE_FILE" "$RUNNER_TEMP/expected.feature"

      # The workflow owns the exploration server, so Claude never has to start or stop it
      - name: Start exploration Appium
        run: |
          nohup npm run appium:explore > "$RUNNER_TEMP/appium-explore.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -s http://127.0.0.1:4724/status | grep -q '"ready":true' && { echo "Appium ready on port 4724"; exit 0; }
            sleep 2
          done
          echo "::error::The exploration Appium server didn't start; see appium-explore.log in the claude-output artifact."
          exit 1

      - name: Implement with Claude Code
        timeout-minutes: 45
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCENARIO_NAME: ${{ steps.scenario.outputs.scenario_name }}
          SCENARIO_LINE: ${{ steps.scenario.outputs.scenario_line }}
          # Unattended, Claude Code waits for background commands before exiting, so allow none,
          # and give foreground commands (a full test run takes several minutes) room to finish
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          BASH_DEFAULT_TIMEOUT_MS: '900000'
          BASH_MAX_TIMEOUT_MS: '1800000'
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an ANTHROPIC_API_KEY repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          PROMPT="Use the implement-feature skill to implement the scenario \"$SCENARIO_NAME\" in $FEATURE_FILE.
          You are running non-interactively in GitHub Actions, so nobody can answer questions.
          - The feature file was written by a human and has already been updated; don't change it.
          - If a step is ambiguous, refers to something that doesn't exist in the app, or can't be automated, don't guess or work around it: stop and explain why.
          - Don't commit or push; the workflow does that after verifying your changes.
          - The exploration Appium server is already running on port 4724 (the workflow started it). Use it; don't start or stop Appium.
          - Run every command in the foreground.
          - To check your work, run only the new scenario: npx wdio run ./config/wdio.ios.conf.ts --spec ./$FEATURE_FILE:$SCENARIO_LINE (don't run the full suite).
          When you're done, use the Write tool to save your report to .ai-result.md in the repository root: a short summary of the steps, page objects and selectors you added or reused and the test results, ending with exactly one line, either 'RESULT: SUCCESS' or 'RESULT: BLOCKED - <one-line reason>'."

          claude -p "$PROMPT" \
            --mcp-config .mcp.json --strict-mcp-config \
            --permission-mode acceptEdits \
            --allowedTools \
              "Read" "Glob" "Grep" "Edit" "Write" "Skill" "TodoWrite" \
              "mcp__appium-mcp" \
              "Bash(npm run test:dry-run:*)" "Bash(npm run typecheck:*)" \
              "Bash(npx wdio run:*)" \
              "Bash(curl -s http://127.0.0.1:4724/status:*)" \
              "Bash(git status:*)" "Bash(git diff:*)" \
            --output-format json > "$RUNNER_TEMP/claude.json" || true

      - name: Check Claude's result
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const file = `${process.env.RUNNER_TEMP}/claude.json`;
          let out;
          try { out = JSON.parse(fs.readFileSync(file, 'utf8')); }
          catch { console.log('::error::Claude Code produced no result; see the claude-output artifact.'); process.exit(1); }

          // Prefer the report file: late messages can't overwrite it the way they can the final reply
          const reportFile = '.ai-result.md';
          const text = (fs.existsSync(reportFile) ? fs.readFileSync(reportFile, 'utf8') : (out.result ?? '')).trim();
          fs.rmSync(reportFile, { force: true });
          // Last non-empty line, ignoring markdown emphasis such as **RESULT: SUCCESS**
          const verdict = (text.split('\n').filter((l) => l.trim()).pop() ?? '').replace(/[*_`]/g, '').trim();
          const denied = [...new Set((out.permission_denials ?? []).map((d) => d.tool_name))];

          fs.writeFileSync(`${process.env.RUNNER_TEMP}/claude-summary.md`, text);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Claude Code', '',
            `Turns: ${out.num_turns ?? '?'} · Cost: $${(out.total_cost_usd ?? 0).toFixed(2)}`
              + (denied.length ? ` · Denied tools: ${denied.join(', ')}` : ''),
            '', text, '',
          ].join('\n'));

          if (out.is_error || !verdict.startsWith('RESULT: SUCCESS')) {
            console.log(`::error::${verdict.startsWith('RESULT: BLOCKED') ? verdict : 'Claude Code did not finish successfully; see the run summary.'}`);
            process.exit(1);
          }
          EOF

      - name: Check what was changed
        run: |
          npm run appium:explore:stop
          if ! cmp -s "$FEATURE_FILE" "$RUNNER_TEMP/expected.feature"; then
            echo "::error::$FEATURE_FILE was modified by the AI; the scenario must stay as written."
            diff "$RUNNER_TEMP/expected.feature" "$FEATURE_FILE" || true
            exit 1
          fi
          # Only step definitions, page objects, the feature file and CLAUDE.md may change
          bad=$(git status --porcelain --untracked-files=all | cut -c4- \
            | grep -vxF "$FEATURE_FILE" | grep -vE '^(src/|CLAUDE\.md$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unexpected files changed:"; echo "$bad"; exit 1
          fi
          git status --short

      # Only the new scenario is verified, twice in a row; the full suite runs after merge to main
      - name: Verify type check and the new scenario (2 runs)
        id: verify
        env:
          SCENARIO_LINE: ${{ steps.scenario.outputs.scenario_line }}
        run: |
          npm run typecheck
          # Start from clean results so the evidence only reflects these runs
          rm -rf allure-results
          for run in 1 2; do
            echo "::group::Run $run of 2: $FEATURE_FILE:$SCENARIO_LINE"
            npx wdio run ./config/wdio.ios.conf.ts --spec "./$FEATURE_FILE:$SCENARIO_LINE"
            echo "::endgroup::"
          done

      # Runs even if the tests failed, so the run summary shows which steps failed.
      # Also fails unless the new scenario passed in both runs with every step passed.
      - name: Build test plan from results
        if: always() && steps.verify.outcome != 'skipped'
        env:
          SCENARIO_NAME: ${{ steps.scenario.outputs.scenario_name }}
          SCENARIO_LINE: ${{ steps.scenario.outputs.scenario_line }}
          REQUIRED_RUNS: '2'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_FILE: ${{ runner.temp }}/test-plan.md
        run: node .github/scripts/test-evidence.mjs

      - name: Push branch
        id: push
        env:
          SCENARIO_NAME: ${{ steps.scenario.outputs.scenario_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="ai/$(basename "$FEATURE_FILE" .feature)-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Implement scenario: $SCENARIO_NAME" -m "Generated by Claude Code via Appium MCP in $RUN_URL"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          SCENARIO_NAME: ${{ steps.scenario.outputs.scenario_name }}
          CREATED: ${{ steps.scenario.outputs.created }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const { BRANCH, SCENARIO_NAME, CREATED, RUN_URL, FEATURE_FILE, RUNNER_TEMP } = process.env;
            const summary = fs.readFileSync(`${RUNNER_TEMP}/claude-summary.md`, 'utf8');
            const scenario = fs.readFileSync(`${RUNNER_TEMP}/expected.feature`, 'utf8');
            const testPlan = fs.readFileSync(`${RUNNER_TEMP}/test-plan.md`, 'utf8');
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: BRANCH,
              base: context.ref.replace('refs/heads/', ''),
              title: `Implement scenario: ${SCENARIO_NAME}`,
              body: [
                `Scenario **${SCENARIO_NAME}** ${CREATED === 'true' ? 'in new file' : 'added to'} \`${FEATURE_FILE}\`, implemented by Claude Code using Appium MCP ([workflow run](${RUN_URL})).`,
                ...(CREATED === 'true' ? ['', `> **New feature file:** after merging, run \`npm run sync:feature-choices\` and commit, so \`${FEATURE_FILE}\` appears in this workflow's dropdown.`] : []),
                '',
                '<details><summary>Feature file</summary>', '', '```gherkin', scenario.trim(), '```', '</details>',
                '',
                testPlan.trim(),
                '',
                '## Claude Code summary', '', summary,
                '',
                '🤖 Generated with [Claude Code](https://claude.com/claude-code)',
              ].join('\n'),
            });
            core.notice(`Opened ${pr.html_url}`);
            await core.summary.addRaw(`\n**Pull request:** ${pr.html_url}\n`).write();

      - name: Stop exploration Appium
        if: always()
        run: npm run appium:explore:stop

      - name: Upload Claude output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-output
          path: |
            ${{ runner.temp }}/claude.json
            ${{ runner.temp }}/test-plan.md
            logs
            allure-results
          if-no-files-found: ignore
