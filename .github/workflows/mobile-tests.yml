name: Mobile tests (iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression, e.g. @smoke or "@cart and not @wip" (empty = all)'
        required: false
        default: ''
      device:
        description: 'Sauce Labs real device name; regular expressions allowed, e.g. "iPhone 1[3-5].*"'
        required: false
        default: 'iPhone.*'

# Sauce Labs plans limit concurrent devices, so run one device job at a time
concurrency:
  group: sauce-labs
  cancel-in-progress: false

jobs:
  ios:
    # The self-hosted Mac only runs WebdriverIO; Appium and the iPhones are at Sauce Labs
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    env:
      TAGS: ${{ github.event.inputs.tags }}
      IOS_DEVICE: ${{ github.event.inputs.device || 'iPhone.*' }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'us-west-1' }}
      SAUCE_BUILD: 'Mobile tests (iOS) #${{ github.run_number }}'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Check Sauce Labs credentials
        run: |
          if [ -z "$SAUCE_USERNAME" ] || [ -z "$SAUCE_ACCESS_KEY" ]; then
            echo "::error::Add SAUCE_USERNAME and SAUCE_ACCESS_KEY repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
          if-no-files-found: ignore
